<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotspot Console -- Layout settings</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  .settings-panel{ max-width: 720px; margin: 0 auto; }
  .layout-row{
    display:grid; grid-template-columns: 28px 1fr 90px 100px; gap:12px; align-items:center;
    padding: 10px 16px; border-bottom:1px solid var(--border-soft);
  }
  .layout-row:last-child{ border-bottom:none; }
  .layout-row.disabled .name{ color:var(--text-faint); }
  .layout-row .name{ font-size:13.5px; font-weight:500; }
  .layout-row select{
    font-family:var(--mono); font-size:12.5px; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border); border-radius:6px; padding:5px 6px;
  }
  .layout-row .reorder{ display:flex; gap:4px; }
  .layout-row .reorder button{
    font-family:var(--mono); font-size:11px; width:26px; height:26px; line-height:1;
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); border-radius:5px; cursor:pointer;
  }
  .layout-row .reorder button:hover{ color:var(--text); border-color:var(--copper-dim); }
  .layout-row .reorder button:disabled{ opacity:0.3; cursor:default; }
  input[type="checkbox"]{ width:16px; height:16px; accent-color: var(--copper); }
  .settings-actions{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .btn{
    font-family: var(--disp); font-weight:600; font-size:12.5px; letter-spacing:0.5px; text-transform:uppercase;
    padding:9px 18px; border-radius:7px; border:1px solid var(--copper-dim); background: var(--copper); color:#1a0f04;
    cursor:pointer;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:var(--surface-2); color:var(--text-dim); border-color:var(--border); }
  .save-msg{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .save-msg.ok{ color:var(--ok); }
  .save-msg.err{ color:var(--crit); }
  a.back{ color:var(--text-dim); font-size:12.5px; text-decoration:none; }
  a.back:hover{ color:var(--copper); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">HS</div>
      <div class="brand-text">
        <span class="title">Layout settings</span>
        <span class="sub">dashboard-v2 preview &middot; which modules, where</span>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <a class="back" href="../">&larr; back to console</a>
  </div>

  <div class="panel settings-panel">
    <div class="panel-head">
      <div class="panel-title">Modules</div>
      <span id="source-tag" class="status-chip" style="padding:3px 9px;"></span>
    </div>
    <div class="panel-body" style="padding:0;">
      <div id="layout-rows"></div>
    </div>
    <div class="panel-foot">
      <div class="settings-actions">
        <button class="btn" id="save-btn">Save</button>
        <button class="btn btn-ghost" id="reset-btn">Reset to shipped default</button>
        <span id="save-msg" class="save-msg"></span>
      </div>
    </div>
  </div>
  <p class="footer-note">Turning a module off or moving it here never touches its own files -- see <b>docs/dashboard-v2-brief.md</b>. Saved to /var/cache/hotspot-image, not to the git checkout.</p>
</div>
<script src="settings.js"></script>
</body>
</html>
